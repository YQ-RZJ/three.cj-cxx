name: native-libs-ios

on:
  workflow_dispatch:
    inputs:
      arches:
        description: "架构，逗号分隔：arm64-v8a（默认仅 arm64-v8a）"
        required: false
        default: "arm64-v8a"
      modes:
        description: "debug/release（留空=脚本默认全编排）"
        required: false
        default: ""
      libtypes:
        description: "static,shared（留空=脚本默认全编排）"
        required: false
        default: ""
      groups:
        description: "组清单（按序，留空则按全量组顺序）"
        required: false
        default: "tracy"
      libs:
        description: "库清单（按序，留空=全部库）"
        required: false
        default: "tracy"

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.set.outputs.arches }}
    steps:
      - id: set
        run: |
          V="${{ inputs.arches }}"
          if [ -z "$V" ]; then V="arm64-v8a"; fi
          echo "arches=[$(echo "$V" | awk -F',' '{for(i=1;i<=NF;i++){gsub(/ /,"",$i); printf "%s\"%s\"", (i>1?",":""), $i}}')]" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    name: ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.config.outputs.arches) }}
    steps:
      - uses: actions/checkout@v4

      # 当前仅 tracy 的 build.py 声明支持 IOS 工具链（xcode）；
      # 其余库如需 IOS 支持须先在各 build.py 中补 IOS 分支。
      - name: Build (tracy only for now)
        run: |
          CMD="python3 .github/scripts/ci_build.py --platform IOS --arch ${{ matrix.arch }}"
          if [ -n "${{ inputs.modes }}" ]; then CMD="$CMD --modes ${{ inputs.modes }}"; fi
          if [ -n "${{ inputs.libtypes }}" ]; then CMD="$CMD --libtypes ${{ inputs.libtypes }}"; fi
          if [ -n "${{ inputs.groups }}" ]; then CMD="$CMD --groups ${{ inputs.groups }}"; fi
          if [ -n "${{ inputs.libs }}" ]; then CMD="$CMD --libs ${{ inputs.libs }}"; fi
          eval "$CMD"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-ios-${{ matrix.arch }}
          path: dist/ios/
          retention-days: 30
