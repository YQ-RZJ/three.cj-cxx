name: native-libs-android

on:
  workflow_dispatch:
    inputs:
      ndk-version:
        description: "Android NDK 固定版本（runner 上安装该版本）"
        required: false
        default: "r27c"

permissions:
  contents: read

env:
  NDK_URL: https://dl.google.com/android/repository/android-ndk-r27c-windows.zip

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest       # ndk 交叉编译在 linux runner 上进行（更快且各 build.py 已验证 ndk 工具链）
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64-v8a]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned NDK r27c
        run: |
          cd $RUNNER_TEMP
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "NDK_HOME=$RUNNER_TEMP/android-ndk-r27c" >> $GITHUB_ENV

      - name: Build all libraries
        run: |
          python3 .github/scripts/ci_build.py --platform ANDROID --arch ${{ matrix.arch }} --ndk "$NDK_HOME"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-android-${{ matrix.arch }}
          path: dist/android/
          retention-days: 30
