name: native-libs-macos

on:
  workflow_dispatch:
    inputs:
      modes:
        description: "debug/release（留空=脚本默认全编排）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: macos-14          # arm64 runner；x86_64 用本机 clang -arch 交叉
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64-v8a]
    steps:
      - uses: actions/checkout@v4

      - name: Build all libraries
        run: |
          python3 .github/scripts/ci_build.py --platform OSX --arch ${{ matrix.arch }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-macos-${{ matrix.arch }}
          path: dist/macos/
          retention-days: 30
