name: native-libs-ohos

on:
  workflow_dispatch:
    inputs:
      sdk-url:
        description: "OHOS SDK (linux) 下载地址，默认华为云 6.0.0.2-Release"
        required: false
        default: "https://repo.huaweicloud.com/harmonyos/os/6.0.0.2-Release/ohos-sdk-windows_linux-public.tar.gz"
      arches:
        description: "架构，逗号分隔：arm64-v8a,x86_64（默认仅 arm64-v8a）"
        required: false
        default: "arm64-v8a"
      modes:
        description: "debug/release（留空=脚本默认全编排）"
        required: false
        default: ""
      libtypes:
        description: "static,shared（留空=脚本默认全编排）"
        required: false
        default: ""
      groups:
        description: "组清单（按序，留空则按全量组顺序）"
        required: false
        default: "bgfx,httpclient,imgui,jolt,luajit,openal,sdl,tracy,cjbridge"
      libs:
        description: "库清单（按序，留空=全部库）"
        required: false
        default: "bx,bimg,bimg_capi,bgfx,geometryc_capi,shaderc_capi,openssl,tlsbridge,cimgui,sdl,openal,miniaudio,jolt,luajit,ffi,napi,dlbridge,tracy"

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.set.outputs.arches }}
    steps:
      - id: set
        run: |
          V="${{ inputs.arches }}"
          if [ -z "$V" ]; then V="arm64-v8a"; fi
          echo "arches=[$(echo "$V" | awk -F',' '{for(i=1;i<=NF;i++){gsub(/ /,"",$i); printf "%s\"%s\"", (i>1?",":""), $i}}')]" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.config.outputs.arches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache OHOS SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/ohos-sdk-native
          key: ohos-sdk-native-6.0.0.2

      - name: Download & extract OHOS SDK (native)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          cd $RUNNER_TEMP
          wget -q "${{ inputs.sdk-url }}" -O ohos-sdk.tar.gz
          # 外层 tar 内是 linux/windows 两份；取 linux 包再解出 native/
          tar -xzf ohos-sdk.tar.gz
          LINUX_TGZ=$(find . -name "ohos-sdk-full-linux-*.tar.gz" | head -1)
          if [ -n "$LINUX_TGZ" ]; then tar -xzf "$LINUX_TGZ"; fi
          NATIVE_DIR=$(find . -type d -name native | grep -i linux | head -1)
          if [ -z "$NATIVE_DIR" ]; then NATIVE_DIR=$(find . -type d -name native | head -1); fi
          mkdir -p ~/ohos-sdk-native
          cp -r "$NATIVE_DIR"/* ~/ohos-sdk-native/
          echo "SDK native contents:" && ls ~/ohos-sdk-native | head

      - name: Build all libraries (incl. SDL3 shared for static packaging)
        run: |
          CMD="python3 .github/scripts/ci_build.py --platform OPHM --arch ${{ matrix.arch }} --ohos-sdk \"$HOME/ohos-sdk-native\""
          if [ -n "${{ inputs.modes }}" ]; then CMD="$CMD --modes ${{ inputs.modes }}"; fi
          if [ -n "${{ inputs.libtypes }}" ]; then CMD="$CMD --libtypes ${{ inputs.libtypes }}"; fi
          if [ -n "${{ inputs.groups }}" ]; then CMD="$CMD --groups ${{ inputs.groups }}"; fi
          if [ -n "${{ inputs.libs }}" ]; then CMD="$CMD --libs ${{ inputs.libs }}"; fi
          eval "$CMD"

      # OHOS 特例：static 目录内需带 <arch>/libSDL3.so（对齐 three/test/ohos/base/entry/libs）
      - name: Attach libSDL3.so into static package
        run: |
          SO=dist/ohos/${{ matrix.arch }}/shared/libSDL3.so
          if [ -f "$SO" ]; then
            mkdir -p dist/ohos/${{ matrix.arch }}/static/${{ matrix.arch }}
            cp "$SO" dist/ohos/${{ matrix.arch }}/static/${{ matrix.arch }}/libSDL3.so
            echo "attached: static/${{ matrix.arch }}/libSDL3.so"
          else
            echo "::warning::libSDL3.so not found in shared output; static package missing SDL3 dylib"
          fi

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-ohos-${{ matrix.arch }}
          path: dist/ohos/
          retention-days: 30
