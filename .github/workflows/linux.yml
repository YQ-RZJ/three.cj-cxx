name: native-libs-linux

on:
  workflow_dispatch:
    inputs:
      arches:
        description: "架构，逗号分隔：x86_64,arm64-v8a（留空=全部）"
        required: false
        default: ""
      modes:
        description: "debug/release（留空=脚本默认全编排）"
        required: false
        default: ""
      libtypes:
        description: "static,shared（留空=脚本默认全编排）"
        required: false
        default: ""
      groups:
        description: "组清单（按序，留空则按全量组顺序）"
        required: false
        default: "bgfx,httpclient,imgui,jolt,luajit,openal,sdl,tracy,cjbridge"
      libs:
        description: "库清单（按序，留空=全部库）"
        required: false
        default: "bx,bimg,bimg_capi,bgfx,geometryc_capi,shaderc_capi,openssl,tlsbridge,cimgui,sdl,openal,miniaudio,jolt,luajit,ffi,napi,dlbridge,tracy"

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.set.outputs.arches }}
    steps:
      - id: set
        run: |
          if [ -n "${{ inputs.arches }}" ]; then
            echo "arches=[$(echo "${{ inputs.arches }}" | awk -F',' '{for(i=1;i<=NF;i++){gsub(/ /,"",$i); printf "%s\"%s\"", (i>1?",":""), $i}}')]" >> "$GITHUB_OUTPUT"
          else
            echo 'arches=["x86_64","arm64-v8a"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: config
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.config.outputs.arches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (X11/OpenGL for bgfx)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev

      - name: Install cross toolchain (arm64)
        if: matrix.arch == 'arm64-v8a'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu gcc-aarch64-linux-gnu
          # bgfx 的 CMakeLists 在 Linux 上 find_package(X11/OpenGL REQUIRED)，
          # arm64 交叉需装 :arm64 多架构运行时库（头文件与 x86_64 共享）。
          # 依赖链根是 libc6:arm64（libx11-6/libgl1 依赖它），gcc-*-aarch64-
          # linux-gnu 自带的 libc6-dev-arm64-cross 不满足 dpkg 多架构依赖。
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb http/deb [arch=amd64] http/' /etc/apt/sources.list
          {
            printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s main universe\n' "$(lsb_release -cs)"
          } | sudo tee /etc/apt/sources.list.d/arm64.list >/dev/null
          sudo apt-get update || true
          sudo apt-get install -y libc6:arm64 libx11-6:arm64 libx11-dev:arm64 \
            libgl1:arm64 libgl1-mesa-dev:arm64 || \
            echo "[WARN] arm64 X11/GL 多架构包安装失败（bgfx_build.py 的预置变量探测会跳过）"

      - name: Build all libraries
        run: |
          CMD="python .github/scripts/ci_build.py --platform LINUX --arch ${{ matrix.arch }}"
          if [ -n "${{ inputs.modes }}" ]; then CMD="$CMD --modes ${{ inputs.modes }}"; fi
          if [ -n "${{ inputs.libtypes }}" ]; then CMD="$CMD --libtypes ${{ inputs.libtypes }}"; fi
          if [ -n "${{ inputs.groups }}" ]; then CMD="$CMD --groups ${{ inputs.groups }}"; fi
          if [ -n "${{ inputs.libs }}" ]; then CMD="$CMD --libs ${{ inputs.libs }}"; fi
          eval "$CMD"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-linux-${{ matrix.arch }}
          path: dist/linux/
          retention-days: 30
