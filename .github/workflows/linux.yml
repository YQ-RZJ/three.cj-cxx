name: native-libs-linux

on:
  workflow_dispatch:
    inputs:
      modes:
        description: "debug/release（留空=脚本默认全编排）"
        required: false
        default: ""
      libtypes:
        description: "static,shared（留空=脚本默认全编排）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64-v8a]
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain (arm64)
        if: matrix.arch == 'arm64-v8a'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Build all libraries
        run: |
          python .github/scripts/ci_build.py --platform LINUX --arch ${{ matrix.arch }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-linux-${{ matrix.arch }}
          path: dist/linux/
          retention-days: 30
