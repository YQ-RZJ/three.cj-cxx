name: native-libs-windows

on:
  workflow_dispatch:
    inputs:
      arches:
        description: "架构，逗号分隔：x86_64,arm64-v8a（留空=全部）"
        required: false
        default: ""
      modes:
        description: "debug/release（留空=脚本默认全编排）"
        required: false
        default: ""
      libtypes:
        description: "static,shared（留空=脚本默认全编排）"
        required: false
        default: ""
      llvm-mingw-url:
        description: "llvm-mingw (arm64 交叉) 下载地址，可改版本"
        required: false
        default: "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip"

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.set.outputs.arches }}
    steps:
      - id: set
        run: |
          if [ -n "${{ inputs.arches }}" ]; then
            echo "arches=[$(echo "${{ inputs.arches }}" | awk -F',' '{for(i=1;i<=NF;i++){gsub(/ /,"",$i); printf "%s\"%s\"", (i>1?",":""), $i}}')]" >> "$GITHUB_OUTPUT"
          else
            echo 'arches=["x86_64","arm64-v8a"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: config
    name: ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.config.outputs.arches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 + mingw-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          update: false
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            make
            python

      - name: Install xmake (bgfx toolchain)
        shell: pwsh
        run: |
          Invoke-Expression (Invoke-WebRequest 'https://xmake.io/psget.text' -UseBasicParsing).Content
          "C:\Program Files\xmake" | Out-File -FilePath $env:GITHUB_PATH -Append

      # arm64-v8a 走 llvm-mingw（aarch64 三元组，build.py --mingw 指定）
      - name: Install llvm-mingw (arm64)
        if: matrix.arch == 'arm64-v8a'
        shell: pwsh
        run: |
          $url = "${{ inputs.llvm-mingw-url }}"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\
          $dir = Get-ChildItem C:\ -Directory -Filter "llvm-mingw-*" | Select-Object -First 1
          "LLVM_MINGW=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build all libraries
        shell: pwsh
        run: |
          $mingwArg = ""
          if ("${{ matrix.arch }}" -eq "arm64-v8a") { $mingwArg = " --mingw `"$env:LLVM_MINGW`"" }
          $cmd = "python .github/scripts/ci_build.py --platform WINDOWS --arch ${{ matrix.arch }}$mingwArg"
          if ("${{ inputs.modes }}" -ne "") { $cmd += " --modes ${{ inputs.modes }}" }
          if ("${{ inputs.libtypes }}" -ne "") { $cmd += " --libtypes ${{ inputs.libtypes }}" }
          bash -lc "$cmd"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-windows-${{ matrix.arch }}
          path: dist/windows/
          retention-days: 30
