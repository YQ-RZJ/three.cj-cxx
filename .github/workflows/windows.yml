name: native-libs-windows

on:
  workflow_dispatch:
    inputs:
      modes:
        description: "debug/release（留空=脚本默认全编排）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64-v8a]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 + mingw-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          update: false
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            make
            python

      # arm64-v8a 走 llvm-mingw（aarch64 三元组，build.py --mingw 指定）
      - name: Install llvm-mingw (arm64)
        if: matrix.arch == 'arm64-v8a'
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz"
          # Windows runner 用 Windows 版 llvm-mingw
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\
          "LLVM_MINGW=C:\llvm-mingw-20240619-ucrt-windows-x86_64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build all libraries
        run: |
          if [ "${{ matrix.arch }}" = "arm64-v8a" ]; then
            python .github/scripts/ci_build.py --platform WINDOWS --arch arm64-v8a --mingw "$LLVM_MINGW"
          else
            python .github/scripts/ci_build.py --platform WINDOWS --arch x86_64
          fi

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-windows-${{ matrix.arch }}
          path: dist/windows/
          retention-days: 30
